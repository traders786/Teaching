    (function () {
      // 1. Intercept Object.defineProperty to ensure any future 'fetch' property definition ALWAYS has a setter
      try {
        var origDefineProperty = Object.defineProperty;
        Object.defineProperty = function (obj, prop, descriptor) {
          if (prop === 'fetch' && descriptor) {
            if (descriptor.get && !descriptor.set) {
              var origGet = descriptor.get;
              var customVal = null;
              descriptor.set = function (newVal) {
                customVal = newVal;
              };
              descriptor.get = function () {
                return customVal !== null ? customVal : origGet.call(this);
              };
            }
            descriptor.configurable = true;
          }
          return origDefineProperty.call(Object, obj, prop, descriptor);
        };
      } catch (e) { }

      // 2. Define safe own property on window and Window.prototype with both getter and setter
      try {
        var nativeFetch = window.fetch;
        var activeFetch = nativeFetch;
        function getFetch() {
          return activeFetch || nativeFetch;
        }
        function setFetch(fn) {
          activeFetch = fn;
        }

        Object.defineProperty(window, 'fetch', {
          get: getFetch,
          set: setFetch,
          configurable: true,
          enumerable: true
        });

        if (typeof Window !== 'undefined' && Window.prototype) {
          Object.defineProperty(Window.prototype, 'fetch', {
            get: getFetch,
            set: setFetch,
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) { }

      // 3. Error listener to prevent unhandled getter error halts
      var filterFetchError = function (e) {
        var msg = (e && (e.message || (e.reason && e.reason.message))) || '';
        if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      };

      window.addEventListener('error', filterFetchError, true);
      window.addEventListener('unhandledrejection', filterFetchError, true);

      var prevOnError = window.onerror;
      window.onerror = function (msg, url, line, col, err) {
        if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
          return true;
        }
        if (typeof prevOnError === 'function') {
          return prevOnError.apply(this, arguments);
        }
        return false;
      };
    })();
  </script>
